# LoRA on Whisper-medium: bigger model, still fits a T4 because only adapters train.
# Usually beats full-FT small on WER, at ~2x slower inference.

model:
  name: openai/whisper-medium
  language: hindi
  task: transcribe
  method: lora

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]

data:
  sampling_rate: 16000
  max_audio_seconds: 30
  max_label_tokens: 440
  sources:
    - name: noisy-hinglish
      type: hf
      dataset: addyo07/noisy-hinglish-asr
      splits: {train: train, eval: val, test: test}
      audio_column: audio
      text_column: transcription
      group_column: language
      keep: {language: [hinglish, hi, en]}
  max_eval_samples: 300
  seed: 42

train:
  output_dir: outputs/whisper-medium-hinglish-lora
  max_steps: 3000
  lr: 1.0e-4
  warmup_steps: 200
  batch_size: 8
  grad_accum: 2
  eval_batch_size: 8
  eval_steps: 500
  save_steps: 500
  logging_steps: 25
  num_workers: 2
  generation_max_length: 225
